[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-ca-updater"
version = "0.2.0"
description = "Install modern root CAs on legacy Android devices over adb, no root required"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luthfi Solahudin" }]
keywords = ["android", "adb", "certificates", "ca", "tls", "lets-encrypt", "legacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/luthfisolahudin/android-ca-updater"

[project.scripts]
android-ca-updater = "android_ca_updater:main"

[tool.setuptools]
py-modules = ["android_ca_updater"]
