[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "android-ca-updater"
version = "0.3.0"
description = "Install modern root CAs on legacy Android devices over adb, no root required"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luthfi Solahudin" }]
keywords = ["android", "adb", "certificates", "ca", "tls", "lets-encrypt", "legacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luthfisolahudin/android-ca-updater"

[project.scripts]
android-ca-updater = "android_ca_updater.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "codespell>=2.4.3",
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "mypy>=1.14",
  "pip-audit>=2.10.1",
  "prek>=0.5.7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "vulture>=2.16",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "android_ca_updater"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "PERF", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[tool.codespell]
skip = "uv.lock,dist,.venv,.git,.mypy_cache,.ruff_cache,.pytest_cache"

[tool.bandit]
exclude_dirs = ["tests"]
# The tool drives external binaries (openssl, adb) with argument lists and never
# a shell; bandit's generic subprocess heuristics do not apply.
skips = ["B404", "B603", "B607"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
  "network: touches the network",
  "openssl: requires the openssl binary in PATH",
  "slow: slow test",
]

[tool.coverage.run]
branch = true
source = ["android_ca_updater"]
# Three-line `python -m` shim; exercised by test_module_entry_point in a child process.
omit = ["src/android_ca_updater/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
