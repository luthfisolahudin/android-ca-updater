[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "android-ca-updater"
version = "0.3.0"
description = "Install modern root CAs on legacy Android devices over adb, no root required"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luthfi Solahudin" }]
keywords = ["android", "adb", "certificates", "ca", "tls", "lets-encrypt", "legacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luthfisolahudin/android-ca-updater"

[project.scripts]
android-ca-updater = "android_ca_updater.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "android_ca_updater"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "PERF", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
  "network: touches the network",
  "openssl: requires the openssl binary in PATH",
  "slow: slow test",
]

[tool.coverage.run]
branch = true
source = ["android_ca_updater"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
